language: 'ko-KR'

tone_instructions: |
  Vue 3와 TypeScript 프로젝트를 기준으로 리뷰해주세요.
  코드의 가독성, 유지보수성, 컴포넌트 설계와 데이터 흐름을 중심으로 리뷰해주세요.
  문제가 있는 경우 왜 문제가 되는지 간단히 설명하고 적절한 개선 방법을 제안해주세요.
  현재 코드의 맥락을 고려하고, 불필요한 추상화나 과도한 최적화는 권장하지 마세요.

reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  review_details: false

  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    - path: '**/*.{ts,vue}'
      instructions: |
        Vue 3 Composition API와 TypeScript를 기준으로 리뷰해주세요.

        Vue:
        - 컴포넌트의 책임이 명확한지 확인해주세요.
        - props, emits, slots가 적절하게 사용되었는지 확인해주세요.
        - ref, reactive, computed, watch를 목적에 맞게 사용했는지 확인해주세요.
        - computed로 처리할 수 있는 값을 불필요하게 state로 관리하지 않는지 확인해주세요.
        - watch를 단순한 값 계산이나 파생 상태에 사용하고 있지 않은지 확인해주세요.
        - v-for의 key가 적절한지 확인해주세요.
        - 템플릿과 컴포넌트의 로직이 지나치게 복잡하지 않은지 확인해주세요.
        - 불필요한 컴포넌트 분리나 composable 추출은 권장하지 마세요.

        TypeScript:
        - 불필요한 any와 타입 단언(as)을 사용하지 않았는지 확인해주세요.
        - props, emits, API 데이터의 타입이 적절하게 정의되었는지 확인해주세요.
        - null과 undefined를 안전하게 처리하는지 확인해주세요.
        - 타입을 불필요하게 복잡하게 만들지 않았는지 확인해주세요.

        Pinia:
        - 전역 상태가 정말 필요한 데이터인지 확인해주세요.
        - 컴포넌트에서 관리할 수 있는 상태를 불필요하게 store에 넣지 않았는지 확인해주세요.
        - store가 UI 로직까지 과도하게 담당하지 않는지 확인해주세요.
        - 동일한 데이터를 여러 곳에서 중복 관리하지 않는지 확인해주세요.

        코드 품질:
        - 코드가 읽기 쉽고 역할이 명확한지 확인해주세요.
        - 중복 로직이 있다면 적절한 수준의 재사용을 제안해주세요.
        - 복잡한 조건문이나 로직은 더 이해하기 쉬운 형태가 있는지 확인해주세요.
        - 실제 문제가 없는 단순한 코드에는 불필요한 패턴이나 추상화를 제안하지 마세요.

        성능:
        - 불필요한 API 호출이나 명확한 성능 문제가 있는 경우에만 개선을 제안해주세요.
        - 성능을 이유로 memoization이나 과도한 최적화를 무조건 권장하지 마세요.

chat:
  auto_reply: true
